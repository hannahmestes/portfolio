<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessibility Audit</title>
  <script src="node_modules/axe-core/axe.min.js"></script>
</head>
<body>
  <h1>Accessibility Audit</h1>
  <button id="runAudit">Run Audit</button>
  <pre id="results"></pre>

  <iframe id="targetPage" src="index.html" style="width: 100%; height: 80vh; border: 1px solid #ccc;"></iframe>

  <script>
    document.getElementById('runAudit').addEventListener('click', async () => {
      const iframe = document.getElementById('targetPage');
      const results = await axe.run(iframe.contentDocument);

      let output = '\n=== ACCESSIBILITY AUDIT RESULTS ===\n\n';
      output += `Total Issues Found: ${results.violations.length + results.passes.length + results.incomplete.length}\n`;

      output += '\n❌ VIOLATIONS (must fix):\n';
      if (results.violations.length === 0) {
        output += '  None! Great job!\n';
      } else {
        results.violations.forEach((violation, index) => {
          output += `\n${index + 1}. ${violation.id}: ${violation.description}\n`;
          output += `   Impact: ${violation.impact}\n`;
          output += `   Help: ${violation.help}\n`;
          output += `   Help URL: ${violation.helpUrl}\n`;
          output += `   Affected Elements: ${violation.nodes.length}\n`;
          violation.nodes.forEach(node => {
            output += `     - ${node.target.join(', ')}\n`;
            output += `       HTML: ${node.html.substring(0, 100)}...\n`;
          });
        });
      }

      output += '\n⚠️  NEEDS REVIEW (incomplete):\n';
      if (results.incomplete.length === 0) {
        output += '  None!\n';
      } else {
        results.incomplete.forEach((issue, index) => {
          output += `\n${index + 1}. ${issue.id}: ${issue.description}\n`;
          output += `   Help: ${issue.help}\n`;
          output += `   Affected Elements: ${issue.nodes.length}\n`;
        });
      }

      output += '\n✅ PASSES:\n';
      output += `  ${results.passes.length} tests passed\n`;

      output += '\n=== END AUDIT ===\n';

      document.getElementById('results').textContent = output;
    });
  </script>
</body>
</html>
